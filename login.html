<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Account — Baiku</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="announcement">Free shipping worldwide over $100 · Easy returns · Authentic gear only</div>
<header class="header"><div class="container nav">
<nav class="nav-links"><a href="shop.html">Shop</a><a href="shop.html?category=Helmets">Helmets</a><a href="shop.html?category=Jackets">Jackets</a><a href="shop.html?category=Pants">Pants</a><a href="shop.html?category=Boots">Boots</a><a href="index.html#story">Philosophy</a></nav>
<a class="logo" href="index.html"><span class="logo-main">Baiku</span><span class="logo-sub">RIDING GEAR</span></a>
<div class="nav-actions"><button class="icon-btn" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 5 5"/></svg></button><a class="user-name" href="login.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="7" r="4"/><path d="M4 21c.7-4.1 3.3-6 8-6s7.3 1.9 8 6"/></svg> Sign in</a><button class="icon-btn" aria-label="Cart" data-cart-open><svg viewBox="0 0 24 24"><path d="M4 7h16l-1 13H5L4 7Z"/><path d="M8 7a4 4 0 0 1 8 0"/></svg><span class="badge cart-count">0</span></button></div>
</div></header>

<main class="login-wrap"><div class="auth-card"><div class="section-kicker">Welcome to Baiku</div><h1 class="section-title" style="margin-bottom:25px">Your account</h1><div class="tabs"><button class="tab active" data-tab="login">Sign in</button><button class="tab" data-tab="register">Create account</button></div><div id="authMessage" class="auth-message" aria-live="polite"></div><form class="form-grid" id="loginForm"><div class="field"><label>Email</label><input type="email" required placeholder="you@example.com"></div><div class="field"><label>Password</label><input type="password" required placeholder="••••••••"></div><button class="btn">Sign in →</button></form><form class="form-grid" id="registerForm" style="display:none"><div class="field"><label>Name</label><input required></div><div class="field"><label>Email</label><input type="email" required></div><div class="field"><label>Password</label><input type="password" required></div><div class="field"><label>Confirm password</label><input type="password" required></div><button class="btn">Create account →</button></form></div></main>

<div class="drawer-backdrop"></div>
<aside class="cart-drawer"><div class="drawer-head"><h2>Your cart</h2><button class="icon-btn" data-cart-close>×</button></div><div class="cart-items"></div><div class="drawer-foot"><div class="total-row"><span>Subtotal</span><strong class="cart-total">Rs. 0</strong></div><a class="btn checkout-btn" href="checkout.html">Checkout →</a></div></aside>
<script src="js/baiku-cart.js"></script><script src="js/main.js"></script><script>
document.addEventListener("DOMContentLoaded", () => {
    const loginForm = document.getElementById("loginForm");
    const registerForm = document.getElementById("registerForm");
    const message = document.getElementById("authMessage");

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = "auth-message" + (type ? " " + type : "");
    }

    document.querySelectorAll("[data-tab]").forEach(tab => {
        tab.addEventListener("click", () => {
            document.querySelectorAll("[data-tab]").forEach(x => x.classList.remove("active"));
            tab.classList.add("active");

            const isLogin = tab.dataset.tab === "login";
            loginForm.style.display = isLogin ? "grid" : "none";
            registerForm.style.display = isLogin ? "none" : "grid";
            showMessage("");
        });
    });

    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = loginForm.querySelector('input[type="email"]').value.trim();
        const password = loginForm.querySelector('input[type="password"]').value;
        const button = loginForm.querySelector("button");

        button.disabled = true;
        button.textContent = "Signing in…";
        showMessage("Signing you in…");

        try {
            const result = await baikuLogin(email, password);
            showMessage(`Welcome back, ${result.user.name}.`, "success");

            setTimeout(() => {
                window.location.href = result.user.role === "admin" ? "admin.php" : "index.html";
            }, 700);
        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            button.disabled = false;
            button.textContent = "Sign in →";
        }
    });

    registerForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const inputs = registerForm.querySelectorAll("input");
        const name = inputs[0].value.trim();
        const email = inputs[1].value.trim();
        const password = inputs[2].value;
        const confirmPassword = inputs[3].value;
        const button = registerForm.querySelector("button");

        if (password !== confirmPassword) {
            showMessage("Passwords do not match.", "error");
            return;
        }

        button.disabled = true;
        button.textContent = "Creating account…";
        showMessage("Creating your Baiku account…");

        try {
            const result = await baikuRegister(name, email, password);
            showMessage(`Account created. Welcome, ${result.user.name}.`, "success");

            setTimeout(() => {
                window.location.href = "index.html";
            }, 700);
        } catch (error) {
            showMessage(error.message, "error");
        } finally {
            button.disabled = false;
            button.textContent = "Create account →";
        }
    });
});
</script>
<script src="js/baiku-auth.js"></script>
</body></html>
